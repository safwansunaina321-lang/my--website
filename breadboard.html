<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>about breadboard</title>
	<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow-x: hidden;
    font-family: Arial, sans-serif;
    color: white;

    background:
        radial-gradient(circle at 10% 20%, #ff00cc 0%, transparent 25%),
        radial-gradient(circle at 90% 15%, #00eaff 0%, transparent 25%),
        radial-gradient(circle at 50% 90%, #7b2cff 0%, transparent 30%),
        linear-gradient(135deg, #050014, #00152b, #12002b);
}

.container {
    width: 92%;
    max-width: 1100px;
    margin: auto;
    padding: 25px 0 50px;
}

header {
    text-align: center;
    padding: 20px 10px;
}

header h1 {
    font-size: clamp(32px, 8vw, 60px);
    margin: 0;
}

header p {
    font-size: 18px;
    color: #bffaff;
}

.image-box {
    background: rgba(255,255,255,0.08);
    padding: 15px;
    border-radius: 22px;
    border: 1px solid rgba(0,238,255,0.4);
    box-shadow: 0 0 30px rgba(0,238,255,0.2);
}

.image-box img {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 15px;
}

.card {
    margin-top: 25px;
    padding: 25px;
    border-radius: 20px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(0,238,255,0.35);
    backdrop-filter: blur(10px);
}

.card h2 {
    color: #00eaff;
}

.card p {
    font-size: 17px;
    line-height: 1.7;
}

.back {
    display: inline-block;
    margin-top: 25px;
    padding: 14px 25px;
    border-radius: 30px;
    background: linear-gradient(90deg, #00eaff, #7b2cff, #ff00cc);
    color: white;
    text-decoration: none;
    font-weight: bold;
}

@media (max-width: 600px) {
    .container {
        width: 94%;
        padding-top: 10px;
    }

    header h1 {
        font-size: 34px;
    }

    header p {
        font-size: 15px;
    }

    .card {
        padding: 18px;
    }

    .card h2 {
        font-size: 22px;
    }

    .card p {
        font-size: 15px;
    }
}
</style>
</head>
<body><b>bread board</b>
<img src="robozen-breadboard.png"
     alt="ROBOZEN Breadboard Guide"
     style="width:90%; max-width:600px; display:block; margin:30px auto; border-radius:20px;">
</body>
</html>
